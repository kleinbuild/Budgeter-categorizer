<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budgeter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one working column, sticky month bar + tabs, ledger tables below a headline equation */
:root{
  --bg:#f2f4f1;--surface:#ffffff;--ink:#16201c;--muted:#5a6863;--line:#d8ded9;
  --accent:#1f5e4f;--on-accent:#ffffff;--soft:#e0ebe6;
  --pos:#17744a;--neg:#b3392a;--warn:#8a5a06;--posbg:#dcf1e5;--negbg:#f7e1dc;--warnbg:#fbecc9;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s0:#9aa39f;
  --head:"Schibsted Grotesk","Hanken Grotesk",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513;--surface:#16201d;--ink:#e6eeea;--muted:#95a59e;--line:#26332f;
  --accent:#6fcfae;--on-accent:#0f1513;--soft:#1c3029;
  --pos:#5cd39f;--neg:#ff8b78;--warn:#e8b04d;--posbg:#123428;--negbg:#3b1e19;--warnbg:#3a2c0d;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s0:#6b7571;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513;--surface:#16201d;--ink:#e6eeea;--muted:#95a59e;--line:#26332f;
  --accent:#6fcfae;--on-accent:#0f1513;--soft:#1c3029;
  --pos:#5cd39f;--neg:#ff8b78;--warn:#e8b04d;--posbg:#123428;--negbg:#3b1e19;--warnbg:#3a2c0d;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s0:#6b7571;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:18px 10px}
h1{font:800 25px/1.1 var(--head);margin:0;letter-spacing:-.02em}
h2{font:700 18px/1.2 var(--head);margin:0 0 10px;text-wrap:balance}
h3{font:700 18px/1.2 var(--head);margin:0 0 14px}
.mn{display:flex;align-items:center;gap:6px}
#mlabel{font:700 17px var(--head);min-width:130px;text-align:center}
.st{font-size:12.5px;color:var(--muted);min-width:80px;text-align:right}
.st.bad{color:var(--neg)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
.tab{padding:10px 13px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font:600 14px var(--body);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.btn{font:600 14px var(--body);padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--neg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lnk{background:none;border:0;padding:0;color:var(--accent);font:600 inherit var(--body);font-size:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.mini{width:108px;text-align:right;padding:4px 8px}
.mid{width:150px}
.sec{margin:28px 0}
.muted{color:var(--muted)}.small{font-size:13px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.eq{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;padding:20px 0 6px}
.eq .t{display:flex;flex-direction:column;min-width:0}
.eq small{color:var(--muted);font-size:13px}
.eq b{font:700 29px/1.1 var(--head);letter-spacing:-.01em}
.eq .op{font:500 24px/1 var(--head);color:var(--muted);padding-bottom:4px}
.eq .free b{font-size:37px}
.left{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:14px 0 0}
.left b{font:700 22px var(--head)}
.note{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13.5px;color:var(--muted);margin:8px 0 0}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.alert{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;margin:14px 0 0;font-size:14px}
.alert.late{background:var(--negbg);color:var(--neg)}
.alert .muted{color:inherit;opacity:.85}
.tip{display:flex;gap:6px 12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:8px}
.tip>span{flex:1;min-width:220px}
.kick{background:var(--soft);border-radius:12px;padding:16px 18px;margin:18px 0 0;display:flex;gap:10px 18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.kick p{margin:4px 0 0;max-width:64ch}
.need{border-color:var(--neg)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
td.act{text-align:right;white-space:nowrap}
tr.done td{opacity:.5}
tr.past td{color:var(--muted)}
tr.tot td{font-weight:600;background:var(--bg)}
tr.grp td{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding-block:6px}
tr.short td:first-child{box-shadow:inset 3px 0 0 var(--neg)}
.grip{display:inline-flex;align-items:center;justify-content:center;width:28px;height:32px;margin:-8px 4px -8px -8px;padding:0;border:0;border-radius:6px;background:none;color:var(--muted);cursor:grab;touch-action:none;vertical-align:middle}
.grip:hover{color:var(--ink);background:var(--soft)}
.grip-sp{display:inline-block;width:24px}
td.catn{white-space:nowrap}
tr.drag td{background:var(--soft)}
tr.drag .grip{cursor:grabbing;color:var(--accent)}
body.dragging,body.dragging *{user-select:none;-webkit-user-select:none;cursor:grabbing}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--accent);margin-left:6px;white-space:nowrap}
.pill.tag{background:var(--warnbg);color:var(--warn)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--neg)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal>div{background:var(--surface);min-height:84px;padding:4px 5px;min-width:0}
.cal>.dow{min-height:0;text-align:center;color:var(--muted);font-size:12px;padding:5px 0}
.cal>.blank{background:var(--bg)}
.cal .day{font-size:12px;color:var(--muted)}
.cal .today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .today .day{color:var(--accent);font-weight:700}
.cal .kday{box-shadow:inset 0 0 0 2px var(--warn)}
.chip{display:block;font-size:11px;line-height:1.35;margin-top:2px;padding:1px 4px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.in{background:var(--posbg);color:var(--pos)}
.chip.out{background:var(--negbg);color:var(--neg)}
.chip.save{background:var(--soft);color:var(--accent)}
.chip.due{background:none;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.chip.note{background:var(--warnbg);color:var(--warn);font-weight:600}
.chip.done{opacity:.45;text-decoration:line-through}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.row .grow{flex:1;min-width:160px}
.qa{display:grid;grid-template-columns:130px 110px minmax(140px,1.4fr) minmax(120px,1fr) minmax(120px,1fr) minmax(90px,.8fr) auto;gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.qa label{display:grid;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.qa .btn{height:40px}
.goal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 8px}
.goal .nm{font-weight:600}
.goal .meta{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.goal .bar{grid-column:1/-1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card small{color:var(--muted);font-size:13px}
.card b{font:700 22px var(--head)}
.viz{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 8px;position:relative}
.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz text{font:12px var(--body);fill:var(--muted)}
.viz .gl{stroke:var(--line);stroke-width:1}
.viz .base{stroke:var(--muted);stroke-width:1}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin:0 0 8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chatlog{display:grid;gap:8px;margin:12px 0 0}
.msg{padding:10px 12px;border-radius:10px;max-width:72ch;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--soft)}
.msg.ai{justify-self:start;background:var(--surface);border:1px solid var(--line)}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg ul{margin:4px 0 6px;padding-left:20px}
.msg .muted{font-size:13px}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:6px;white-space:nowrap;z-index:3;transform:translate(-50%,-110%)}
.foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto}
dialog::backdrop{background:rgba(10,15,20,.55)}
.fld{display:grid;gap:4px;margin:0 0 12px}
.fld label{font-size:13px;color:var(--muted)}
.fld small{color:var(--muted);font-size:12.5px}
.fld.two{grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--neg);font-size:13.5px;min-height:1em;margin:0 0 8px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.acts.left{justify-content:flex-start;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20}
.since{font-size:12.5px;color:var(--muted);line-height:1.5}
@media (max-width:760px){.qa{grid-template-columns:1fr 1fr}.qa .wide{grid-column:1/-1}.qa .btn{grid-column:1/-1}}
@media (max-width:640px){
  .cal>div{min-height:52px}
  .chip{font-size:0;height:7px;width:7px;padding:0;display:inline-block;border-radius:50%;margin:3px 2px 0 0}
  .chip.in{background:var(--pos)}.chip.out{background:var(--neg)}.chip.due{background:var(--muted);box-shadow:none}.chip.note{background:var(--warn)}.chip.save{background:var(--accent)}
  .eq b{font-size:23px}.eq .free b{font-size:29px}
  th,td{padding:8px}
}
@media (max-width:640px){.kt thead{display:none}.kt,.kt tbody{display:block}.kt tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px;border-bottom:1px solid var(--line)}.kt tr.grp{display:block;padding:6px 12px}.kt td{border:0;padding:0;text-align:left!important}.kt td:first-child{grid-column:1/-1}.kt td:empty{display:none}.kt td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--muted)}.kt .mini,.kt .mid{width:100%;text-align:left}}
@media (prefers-reduced-motion:no-preference){.toast{animation:fade .2s}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Budgeter</h1>
    <div class="mn" id="mnav">
      <button class="btn sm" data-act="prev" aria-label="Previous month">&lsaquo;</button>
      <span id="mlabel"></span>
      <button class="btn sm" data-act="next" aria-label="Next month">&rsaquo;</button>
      <button class="btn sm ghost" data-act="today">Today</button>
    </div>
    <span id="st" class="st"></span>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="overview">Overview</button>
    <button class="tab" role="tab" data-tab="spend">Spending</button>
    <button class="tab" role="tab" data-tab="bills">Bills</button>
    <button class="tab" role="tab" data-tab="income">Income</button>
    <button class="tab" role="tab" data-tab="accounts">Accounts</button>
    <button class="tab" role="tab" data-tab="debt">Debt</button>
    <button class="tab" role="tab" data-tab="trends">Trends</button>
    <button class="tab" role="tab" data-tab="goals">Goals</button>
  </div>
  <main id="main"><div class="empty" style="margin-top:24px">Loading your budget…</div></main>
  <div class="foot"><button class="btn sm" data-act="kickoff">Redo kickoff</button><button class="btn sm" data-act="backup">Download backup</button><button class="btn sm" data-act="restore">Restore from backup</button><input type="file" id="rf" accept=".json,application/json" hidden><span class="muted" id="savenote">Changes save automatically to this device.</span></div>
</div>
<dialog id="dlg"></dialog>
<script>
(()=>{
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f0=n=>(n<-0.5?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const f2=n=>(n<-0.004?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const sum=a=>a.reduce((s,e)=>s+(+e.amt||0),0);
const now=new Date();
const TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const dl=iso=>iso?`${MON[+iso.slice(5,7)-1]} ${+iso.slice(8,10)}`:'';
const mi=iso=>(+iso.slice(0,4))*12+(+iso.slice(5,7))-1;
const FREQS=[['monthly','Monthly'],['semi','Twice a month'],['biweekly','Every 2 weeks'],['weekly','Weekly'],['quarterly','Every 3 months'],['semiannual','Every 6 months'],['yearly','Yearly'],['once','One time']];
const TYPES=[['checking','Checking'],['savings','Savings'],['cash','Cash'],['investment','Investment'],['retirement','Retirement (401k, IRA)'],['hsa','HSA (health savings account)'],['property','Vehicle or property'],['credit','Credit card'],['loan','Loan']];
const DEFAULT_CATS=['Housing','Utilities','Groceries','Take Out','Dining & Bars','Transport','Insurance','Subscriptions','Health','Shopping','Entertainment','Travel','Savings','Other'];
const RESERVED=['Bill payment','Transfer','Income','Uncategorized'];
const NOSPEND=['Bill payment','Transfer','Income'];
const blank=()=>({v:2,income:[],bills:[],accounts:[],goals:[],cats:DEFAULT_CATS.map(name=>({name,budget:0})),rules:'',done:{},actual:{},applied:{},showPlanned:false,interestIn:false,kickoff:'',kickDone:false,nw:{},merch:{},extra:0,strategy:'avalanche'});

let plan=null,tx={},view={y:now.getFullYear(),m:now.getMonth()},tab='overview',fq='',fcat='',ftag='';
const mk=v=>`${v.y}-${pad(v.m+1)}`;
const isDebt=a=>a&&(a.type==='credit'||a.type==='loan');
const acct=id=>plan.accounts.find(a=>a.id===id);
const acctName=id=>acct(id)?.name||'—';
/* HSA: money set aside for health costs. Its debit card purchases come out of the HSA, not your spending money */
const isHSA=a=>!!a&&a.type==='hsa';
const hsaPaid=t=>isHSA(acct(t.acct));
/* logged purchases (and refunds) on the HSA card after its balance was last recorded */
function hsaSpent(a){
  let s=0;const on=a.upd||'';
  Object.values(tx).forEach(m=>m.items.forEach(t=>{
    if(t.acct!==a.id)return;
    if(a.updAt&&t.at?t.date>=on&&t.at>a.updAt:t.date>on)s-=t.amt;
  }));
  return r2(s);
}
const hsaNow=a=>r2((+a.bal||0)-hsaSpent(a));
/* IRS limits: [self-only, family]; people 55 and older can add a catch-up amount */
const HSA_LIMITS={2025:[4300,8550],2026:[4400,8750]},HSA_CATCHUP=1000;
function hsaYear(a){
  const y=now.getFullYear(),ly=HSA_LIMITS[y]?y:Math.max(...Object.keys(HSA_LIMITS).map(Number));
  const limit=HSA_LIMITS[ly][a.cover==='family'?1:0]+(a.age55?HSA_CATCHUP:0);
  const per=(+a.contrib||0)+(+a.match||0),from=a.ytdOn&&a.ytdOn.slice(0,4)==String(y)?a.ytdOn:TODAY;let left=0;
  if(per>0&&a.cdate)for(let m=now.getMonth();m<12;m++)left+=occ({freq:a.cfreq||'biweekly',date:a.cdate,day2:a.cday2},y,m).filter(d=>d>from).length*per;
  const so=a.ytdOn&&a.ytdOn.slice(0,4)==String(y)?+a.ytd||0:0;
  return{limit,limitYear:ly,so,left:r2(left),total:r2(so+left)};
}
const KICK=()=>plan.kickoff||'';
const START=()=>KICK()>TODAY?KICK():TODAY;

/* ---------- storage: a copy on this device and a copy in your account ---------- */
const S={db:null,uid:null,locked:false};
const lget=k=>{try{const v=localStorage.getItem('budgeter:'+k);return v?JSON.parse(v):null}catch(e){return null}};
const lset=(k,o)=>{try{localStorage.setItem('budgeter:'+k,JSON.stringify(o));return true}catch(e){return false}};
const cpath=k=>`data/users/${S.uid}/${k}`;
const pend={},timers={},chain={};
function status(t,c){const e=$('#st');e.textContent=t;e.className='st '+(c||'')}
const okMsg=()=>S.db?'Saved to account and device':'Saved on this device';
async function sRead(k){
  const l=lget(k);let c=null;
  if(S.db){const s=await S.db.doc(cpath(k)).get();c=s.exists?clone(s.data()):null}
  if(l&&(!c||(l._ts||0)>(c._ts||0))){if(S.db){pend[k]=l;timers[k]=setTimeout(()=>flushKey(k),400)}return l}
  return c;
}
function flushKey(k){
  clearTimeout(timers[k]);const o=pend[k];if(!o||!S.db)return;delete pend[k];
  chain[k]=(chain[k]||Promise.resolve()).then(()=>S.db.doc(cpath(k)).set(o)).then(()=>{if(!Object.keys(pend).length)status(okMsg())},()=>{
    pend[k]=pend[k]||o;timers[k]=setTimeout(()=>flushKey(k),10000);status('Saved on this device, retrying account','bad');
  });
}
const flushAll=()=>Object.keys(pend).forEach(flushKey);
function persist(k,get){
  if(S.locked)return;

function restore(file){

    const ok=b&&(b.app==='budgeter'||b.app==='monthly-planner')&&b.plan&&['income','bills','accounts'].every(k=>Array.isArray(b.plan[k]));

function occ(it,y,m){
  if(!it.date)return[];
  const [ay,am,ad0]=it.date.split('-').map(Number),ad=+it.dom||ad0;
  const dim=new Date(y,m+1,0).getDate(),i=y*12+m,ai=ay*12+am-1,f=it.freq,o=[];
  const k=d=>`${y}-${pad(m+1)}-${pad(d)}`,c=d=>Math.min(Math.max(1,d),dim);
  if(f==='weekly'||f==='biweekly'){
    const st=f==='weekly'?7:14,a=Date.UTC(ay,am-1,ad);
    for(let d=1;d<=dim;d++){const diff=(Date.UTC(y,m,d)-a)/864e5;if(diff>=0&&diff%st===0)o.push(k(d))}
  }else if(i>=ai){
    if(f==='once'){if(i===ai)o.push(k(ad))}
    else if(f==='monthly')o.push(k(c(ad)));
    else if(f==='semi'){o.push(k(c(ad)));o.push(k(c(+it.day2||15)))}
    else if(f==='quarterly'){if((i-ai)%3===0)o.push(k(c(ad)))}
    else if(f==='semiannual'){if((i-ai)%6===0)o.push(k(c(ad)))}
    else if(f==='yearly'){if((i-ai)%12===0)o.push(k(c(ad)))}
  }
  return [...new Set(o)].sort().filter(d=>d>=it.date&&(!it.end||d<=it.end));
}

  return(i.date>TODAY&&i.freq!=='once'?`Starts ${md}, ${y}. `:'')+s+(i.end?`, until ${MON[+i.end.slice(5,7)-1]} ${i.end.slice(0,4)}`:'');

function evs(y,m,raw){

  for(let j=-1;j<=1;j++){const i=y*12+m+j;build(Math.floor(i/12),((i%12)+12)%12).forEach(e=>{if(e.date.slice(0,7)===mk2&&(j===0||e.pay))o.push(e)})}

function applyEv(bal,hold,e){

  else if(a){bal[a.id]+=(e.t==='out'?-1:1)*e.amt*(isDebt(a)?-1:1);e.after=bal[a.id];e.debt=isDebt(a)}

function project(){

  plan.accounts.forEach(a=>{const inv=a.type==='investment';bal[a.id]=inv?(+a.cash||0):isHSA(a)?hsaNow(a):(+a.bal||0);if(inv)hold[a.id]=+a.bal||0});

    const list=i===vi?cur:evs(Math.floor(i/12),i%12);
    list.forEach(e=>{
      if(e.date<s0||plan.done[e.key])return;
      const a=acct(e.acct);

function openForm(title,fields,vals,onSave){
  const d=$('#dlg');
  d.innerHTML=`<h3>${esc(title)}</h3>`+fields.map(f=>{
    const val=vals[f.k]??'';let inp;
    if(f.t==='select')inp=`<select id="f-${f.k}" name="${f.k}">${f.opts.map(([v,l])=>`<option value="${esc(v)}"${String(v)===String(val)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
    else if(f.t==='checkbox')inp=`<label class="chk"><input id="f-${f.k}" type="checkbox" name="${f.k}"${val?' checked':''}> ${esc(f.l)}</label>`;
    else if(f.t==='textarea')inp=`<textarea id="f-${f.k}" name="${f.k}" rows="8" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
    else inp=`<input id="f-${f.k}" name="${f.k}" type="${f.t||'text'}"${f.t==='number'?' step="any" inputmode="decimal"':''}${f.list?` list="dl-${f.k}"`:''} value="${esc(val)}" placeholder="${esc(f.ph||'')}">${f.list?`<datalist id="dl-${f.k}">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`;
    return`<div class="fld" data-k="${f.k}">${f.t==='checkbox'?'':`<label for="f-${f.k}">${esc(f.l)}</label>`}${inp}${f.help?`<small>${esc(f.help)}</small>`:''}</div>`;
  }).join('')+`<p class="err" id="ferr"></p><div class="acts"><button class="btn" type="button" data-close>Cancel</button><button class="btn pri" type="button" id="fs">Save</button></div>`;
  const get=()=>{const o={};fields.forEach(f=>{const el=d.querySelector(`[name="${f.k}"]`);o[f.k]=f.t==='checkbox'?el.checked:f.t==='number'?(el.value===''?NaN:parseFloat(el.value)):el.value.trim()});return o};
  const sync=()=>{const o=get();fields.forEach(f=>{if(f.show)d.querySelector(`[data-k="${f.k}"]`).hidden=!f.show(o)})};
  d.oninput=d.onchange=sync;sync();
  d.onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='file'){e.preventDefault();$('#fs').click()}};
  d.querySelector('[data-close]').onclick=()=>d.close();
  $('#fs').onclick=()=>{
    const o=get();
    for(const f of fields){
      if(f.show&&!f.show(o)){o[f.k]=f.t==='number'?0:f.t==='checkbox'?false:'';continue}
      if((typeof f.req==='function'?f.req(o):f.req)&&(f.t==='number'?isNaN(o[f.k]):!o[f.k])){$('#ferr').textContent=`${f.l} is required.`;return}
      if(f.t==='number'&&isNaN(o[f.k]))o[f.k]=0;
    }
    d.close();onSave(o);
  };
  d.showModal();
}
function ask(msg,label,yes){
  const d=$('#dlg');
  d.innerHTML=`<h3>${esc(msg)}</h3><div class="acts"><button class="btn" data-close>Cancel</button><button class="btn pri" id="fy">${esc(label)}</button></div>`;
  d.onkeydown=null;d.oninput=d.onchange=null;
  d.querySelector('[data-close]').onclick=()=>d.close();
  $('#fy').onclick=()=>{d.close();yes()};d.showModal();
}

function syncDue(a){
  if(a.type!=='credit'||!+a.dueDay)return;
  a.dueDay=Math.min(31,Math.max(1,Math.round(+a.dueDay)));
  if(!a.duedate||a.duedate!==nextDue(a,a.duedate.slice(0,8)+'01'))a.duedate=nextDue(a,a.duedate&&a.duedate>=TODAY?a.duedate.slice(0,8)+'01':START());
}

  const nd=nextDue(a,addDays(a.duedate&&a.duedate>=START()?a.duedate:addDays(START(),-1),1));
  openForm(`New statement for ${a.name}`,[{k:'stmt',l:`Statement balance, due ${wdl(nd)}`,t:'number',req:1},{k:'bal',l:'Owed now (optional)',t:'number',ph:String(+a.bal||0)}],{},o=>{

/* sort this month's uncategorized purchases: your memory and rules first, then the AI for the rest */
async function aiSortMonth(btn){
  const m=mk(view),items=tx[m].items.filter(t=>t.amt<0&&t.cat==='Uncategorized');if(!items.length)return;
  let n=0;items.forEach(t=>{const c=catFor(t.desc,t.amt);if(c!=='Uncategorized'){t.cat=c;n++}});
  const left=items.filter(t=>t.cat==='Uncategorized'),caps=left.length?await sampleCaps():null;
  if(left.length&&!caps?.pick){if(n){saveTx(m);paint()}toast(n?`Sorted ${n} from your rules. ${caps?.desktop?'Turn on the local AI to sort the rest.':'AI sorting needs the Mac app with Ollama.'}`:caps?.desktop?'The local AI isn’t ready. Open Spending → Import statement to see how to turn it on.':'AI sorting needs the Mac app with Ollama.');return}
  let a=0;
  if(left.length){
    btn.disabled=true;btn.textContent='Sorting…';
    try{const got=await aiCategorize([...new Set(left.map(t=>t.desc))],caps,(i,k)=>{btn.textContent=`Sorting ${i} of ${k}…`});
      left.forEach(t=>{if(got.has(t.desc)){t.cat=got.get(t.desc);t.ai=true;a++}})}
    catch(e){toast(['offline','no_model','timeout'].includes(e?.code)?claudeErr(e,''):`${AI_NAME} couldn’t sort them this time.`)}
  }
  if(n||a)saveTx(m);if(a)fcat='__ai';paint();
  const still=items.length-n-a;
  if(n||a)toast([n?`${n} sorted by your rules`:'',a?`${a} picked by AI, shown for review`:'',still?`${still} still uncategorized`:''].filter(Boolean).join(', '));
}

/* ---------- import ---------- */
const pn=s=>{s=String(s??'').trim();if(!s)return NaN;const neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/-$/.test(s);const n=parseFloat(s.replace(/[^0-9.]/g,''));return isNaN(n)?NaN:neg?-n:n};
function pd(s){
  s=String(s||'').trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return +m[2]>12?null:`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)){let y=+m[3];if(y<100)y+=2000;return +m[1]>12?null:`${y}-${pad(+m[1])}-${pad(+m[2])}`}
  if(/[a-z]{3}/i.test(s)){const d=new Date(s);if(!isNaN(d)&&d.getFullYear()>=2000)return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
  return null;
}
function parseCSV(t){
  t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/,1)[0]||'';
  const D=[',','\t',';'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];

  if(c==='refused')return`${AI_NAME} wouldn’t read ${what}. Try a different one, or use CSV.`;
  if(c==='image_rejected')return`${AI_NAME} couldn’t open that image. Use a PNG or JPEG screenshot.`;

    const act=ds.filter(d=>d.bal>0.005&&m>=d.start).sort(strat==='snowball'?(a,b)=>a.bal-b.bal:(a,b)=>b.apr-a.apr||a.bal-b.bal);
    for(const d of act){if(pool<=0)break;const p=Math.min(pool,d.bal);d.bal-=p;pool-=p}

}

  l.hidden=!askLog.length;
  const busy=!!askRun;$('#askgo').disabled=busy;$('#askstop').hidden=!busy;$('#askclr').hidden=busy||!askLog.length;
  document.querySelectorAll('[data-askq]').forEach(b=>b.disabled=busy);
}
async function wireAsk(){
  const box=$('#askbody');if(!box)return;
  const c=await sampleCaps();if(!$('#askbody'))return;
  if(!c?.chat){if(c?.desktop)box.innerHTML=`<p class="muted small">${aiSetup(c)}</p><button class="btn sm" data-act="askchk">Check again</button>`;else $('#ask').hidden=true;return}
  box.innerHTML=`<p class="muted small">${c.local?`Answered on this Mac by ${LOCAL_MODEL}. Nothing leaves your computer.`:'Answered by Claude.'} The app works out the totals for ${MONL[view.m]} and the 5 months before it, and the AI explains them, so double-check anything important.</p>
  <div class="chatlog" id="asklog"></div>
  <div class="row" style="margin-top:10px">${ASK_SUGGEST.map(q=>`<button class="btn sm" type="button" data-askq="${esc(q)}">${esc(q)}</button>`).join('')}</div>
  <form class="row" id="askf" autocomplete="off"><input class="grow" id="askq" placeholder="Ask anything about your spending" aria-label="Your question"><button class="btn pri" type="submit" id="askgo">Ask</button><button class="btn" type="button" id="askstop" hidden>Stop</button><button class="btn ghost" type="button" id="askclr">Clear</button></form>`;
  const ask=q=>{
    q=q.trim();if(!q||askRun)return;
    askLog.push({role:'user',content:q});const a={role:'assistant',content:''};askLog.push(a);
    const msgs=[{role:'system',content:ASK_RULES+spendingFacts()},...askLog.slice(-9,-1).map(({role,content})=>({role,content}))];
    askRun=c.chat(msgs,t=>{a.content=t;drawAsk()});drawAsk();
    askRun.done.then(t=>{a.content=t},e=>{a.content=e?.text||'';a.note=e?.code==='cancelled'?'Stopped.':['offline','no_model','timeout','rate_limited','not_granted','sampling_disabled'].includes(e?.code)?claudeErr(e,'that'):`${AI_NAME} couldn’t answer that. Try again.`})
      .finally(()=>{askRun=null;if(!a.content&&!a.note)a.note='No answer came back. Try again.';drawAsk()});
  };
  $('#askf').onsubmit=e=>{e.preventDefault();const q=$('#askq').value;$('#askq').value='';ask(q)};
  box.querySelectorAll('[data-askq]').forEach(b=>b.onclick=()=>ask(b.dataset.askq));
  $('#askstop').onclick=()=>askRun?.stop();
  $('#askclr').onclick=()=>{askLog=[];drawAsk()};
  drawAsk();
}
function wireTips(){
  document.querySelectorAll('.viz').forEach(v=>{
    let tt=null;
    v.addEventListener('pointermove',e=>{const t=e.target.closest('[data-tip]');if(!t){tt&&(tt.hidden=true);return}
      if(!tt){tt=document.createElement('div');tt.className='tt';v.appendChild(tt)}
      const r=v.getBoundingClientRect();tt.hidden=false;tt.textContent=t.dataset.tip.replace(/&amp;/g,'&');tt.style.left=Math.min(r.width-60,Math.max(60,e.clientX-r.left))+'px';tt.style.top=(e.clientY-r.top-6)+'px'});
    v.addEventListener('pointerleave',()=>{tt&&(tt.hidden=true)});
  });
}

/* ---------- goals ---------- */
function goalCard(g){
  const t=+g.target||0,s=+g.saved||0,pct=t>0?Math.min(100,s/t*100):0,need=goalNeed(g);
  let when='No target date';
  if(g.date){const ml=mi(g.date)-(now.getFullYear()*12+now.getMonth());when=`By ${MON[+g.date.slice(5,7)-1]} ${g.date.slice(0,4)}, ${s>=t?'reached':ml<=0?'due now':ml+' months left'}`}
  return`<div class="goal"><span class="nm">${esc(g.name)}</span><span class="act"><button class="btn sm" data-act="fund" data-id="${g.id}">Add funds</button> <button class="btn sm" data-act="edit" data-kind="goals" data-id="${g.id}">Edit</button> <button class="btn sm ghost danger" data-act="del" data-kind="goals" data-id="${g.id}">Delete</button></span>
  <span class="meta">${f0(s)} of ${f0(t)}, ${when}${need?`, needs ${f0(need)} a month`:''}${g.acct?`, kept in ${esc(acctName(g.acct))}`:''}</span><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
function vGoals(){
  const grp=(k,title)=>{const l=plan.goals.filter(g=>g.kind===k).sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:1);return l.length?`<div class="sec"><h2>${title}</h2>${l.map(goalCard).join('')}</div>`:''};
  const need=plan.goals.reduce((s,g)=>s+goalNeed(g),0);
  return`<div class="row" style="margin-top:16px"><button class="btn pri" data-act="add" data-kind="goals">Add goal</button>${need?`<span class="muted">Together your goals need <b>${f0(need)}</b> a month.</span>`:''}</div>
  ${plan.goals.length?grp('short','Short term')+grp('long','Long term'):'<div class="empty">No goals yet. Add an emergency fund, a trip, or a bigger long-term target. Monthly amounts come out of your spending money on the Overview.</div>'}`;
}

/* ---------- render ---------- */
const VIEWS={overview:vOverview,kickoff:vKick,spend:vSpend,income:()=>vList('income'),bills:()=>vList('bills'),accounts:vAccounts,debt:vDebt,trends:vTrends,goals:vGoals};
function paint(){
  $('#mlabel').textContent=`${MONL[view.m]} ${view.y}`;
  $('#mnav').hidden=['goals','debt','kickoff'].includes(tab);
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===tab));
  $('#main').innerHTML=VIEWS[tab]();
  wireQA();wireTips();if(tab==='trends')wireAsk();
  if(tab==='spend'){
    const up=()=>{$('#txb').innerHTML=txRows();$('#txs').textContent=txSum()};
    $('#q').oninput=e=>{fq=e.target.value;up()};
    $('#fc').onchange=e=>{fcat=e.target.value;up()};
    $('#ft').onchange=e=>{ftag=e.target.value;up()};
  }
}
let allLoaded=false;
async function render(){
  if(!plan)return;
  const i=view.y*12+view.m,p=`${Math.floor((i-1)/12)}-${pad((i-1)%12+1)}`;
  await ensureTx(mk(view));await ensureTx(p);
  /* HSA balances subtract card purchases since the balance date, so load those months (up to two years) */
  const ci=now.getFullYear()*12+now.getMonth();
  for(const a of plan.accounts.filter(isHSA))for(let j=Math.max(a.upd?mi(a.upd):ci,ci-24);j<=ci;j++)await ensureTx(`${Math.floor(j/12)}-${pad(j%12+1)}`);
  if(tab==='trends'){if(!allLoaded){for(const m of await allMonths())await ensureTx(m);allLoaded=true}for(let j=i-5;j<=i;j++)await ensureTx(`${Math.floor(j/12)}-${pad(j%12+1)}`)}
  paint();
}

/* ---------- events ---------- */
const shift=n=>{const i=view.y*12+view.m+n;view={y:Math.floor(i/12),m:((i%12)+12)%12};render()};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-tab]');if(!b||!plan)return;
  if(b.dataset.tab){tab=b.dataset.tab;lset('ui',{tab});render();return}
  const {act,kind,id}=b.dataset;
  if(act==='prev')shift(-1);else if(act==='next')shift(1);
  else if(act==='today'){view={y:now.getFullYear(),m:now.getMonth()};render()}
  else if(act==='kickoff'){if(!plan.kickoff)plan.kickoff=START();tab='kickoff';render();scrollTo(0,0)}
  else if(act==='kgo')kickGo();
  else if(act==='askchk')wireAsk();
  else if(act==='duesave'){const el=b.closest('.tip')?.querySelector('[data-act="due"]');if(el&&el.value.trim()&&setDue(b.dataset.key,el.value)){paint();dueToast(b.dataset.key)}}
  else if(act==='kest'){const el=document.querySelector(`[data-kb="${id}"]`);if(el)el.value=b.dataset.v}
  else if(act==='kuse')document.querySelectorAll('[data-act="kest"]').forEach(x=>{const el=document.querySelector(`[data-kb="${x.dataset.id}"]`);if(el)el.value=x.dataset.v});
  else if(act==='add')edit(kind);else if(act==='edit')edit(kind,id);else if(act==='del')del(kind,id);
  else if(act==='fund')fundGoal(id);
  else if(act==='nextstmt')nextStmt(id);
  else if(act==='ics'){const {tips}=project();const sel=b.dataset.i==='all'?tips:[tips[+b.dataset.i]].filter(Boolean);if(sel.length)tipIcs(sel)}
  else if(act==='backup')backup();else if(act==='restore')$('#rf').click();
  else if(act==='tadd')editTx();else if(act==='tedit')editTx(id);
  else if(act==='tdel'){const m=mk(view);tx[m].items=tx[m].items.filter(t=>t.id!==id);saveTx(m);paint()}
  else if(act==='timport')openImport();else if(act==='trules')editRules();
  else if(act==='taisort')aiSortMonth(b);
  else if(act==='taiok'){const m=mk(view);tx[m].items.forEach(t=>{if(t.ai){delete t.ai;learn(t,true)}});saveTx(m);savePlan();if(fcat==='__ai')fcat='';paint();toast('AI picks accepted. These merchants will be sorted the same way next time.')}
  else if(act==='catadd')openForm('Add category',[{k:'name',l:'Category name',req:1},{k:'budget',l:'Monthly budget',t:'number'}],{},o=>{if(!catList().includes(o.name)){plan.cats.push({name:o.name,budget:o.budget});savePlan()}render()});
  else if(act==='catdel'){const c=b.dataset.cat;ask(`Remove category “${c}”?`,'Remove',()=>{plan.cats=plan.cats.filter(x=>x.name!==c);savePlan();render()})}
});
/* budget categories: drag the grip (mouse or touch) or use arrow keys on it; the order is the plan's category order */
function catOrder(names){
  const before=plan.cats.map(c=>c.name).join('\n');
  plan.cats.sort((a,b)=>names.indexOf(a.name)-names.indexOf(b.name));
  if(plan.cats.map(c=>c.name).join('\n')!==before)savePlan();
}
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip');if(!g||!plan||e.button>0)return;
  e.preventDefault();
  /* listen on the document: moving the row in the DOM drops pointer capture on the grip */
  const tr=g.closest('tr'),tb=tr.parentNode,pid=e.pointerId;let lastY=e.clientY,raf=0;
  tr.classList.add('drag');document.body.classList.add('dragging');
  /* the row goes past every neighbour whose middle the pointer has crossed */
  const place=y=>{
    const rows=[...tb.querySelectorAll('tr[data-cat]')],i=rows.indexOf(tr);let j=i;
    for(let k=0;k<rows.length;k++){
      if(k===i)continue;const b=rows[k].getBoundingClientRect(),mid=b.top+b.height/2;
      if(k<i&&y<mid){j=k;break}
      if(k>i&&y>mid)j=k;
    }
    if(j<i)tb.insertBefore(tr,rows[j]);else if(j>i)tb.insertBefore(tr,rows[j].nextSibling);
  };
  const edge=()=>{const d=lastY<70?-12:lastY>innerHeight-70?12:0;if(d){scrollBy(0,d);place(lastY);raf=requestAnimationFrame(edge)}else raf=0};
  const move=ev=>{if(ev.pointerId!==pid)return;ev.preventDefault();lastY=ev.clientY;place(lastY);if(!raf)raf=requestAnimationFrame(edge)};
  const end=ev=>{
    if(ev.pointerId!==pid)return;
    cancelAnimationFrame(raf);document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);document.removeEventListener('pointercancel',end);
    tr.classList.remove('drag');document.body.classList.remove('dragging');
    catOrder([...tb.querySelectorAll('tr[data-cat]')].map(r=>r.dataset.cat));
  };
  document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
});
document.addEventListener('keydown',e=>{
  const g=e.target.closest?.('.grip');if(!g||!plan||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
  e.preventDefault();
  const names=plan.cats.map(c=>c.name),i=names.indexOf(g.dataset.cat),j=i+(e.key==='ArrowUp'?-1:1);
  if(i<0||j<0||j>=names.length)return;
  [names[i],names[j]]=[names[j],names[i]];catOrder(names);paint();
  [...document.querySelectorAll('.grip')].find(x=>x.dataset.cat===g.dataset.cat)?.focus();
});
document.addEventListener('change',e=>{
  const b=e.target.closest('[data-act]');if(!b||!plan)return;const {act,id}=b.dataset;const A=()=>acct(id),num=()=>parseFloat(b.value)||0;
  if(act==='done'||act==='kdone'){const k=b.dataset.key;if(b.checked)plan.done[k]=1;else delete plan.done[k];savePlan();if(act==='done')paint()}
  else if(act==='kdate'){plan.kickoff=b.value;savePlan();paint()}
  else if(act==='planned'){plan.showPlanned=b.checked;savePlan();paint()}
  else if(act==='intin'){plan.interestIn=b.checked;savePlan();paint()}
  else if(act==='extra'){plan.extra=Math.max(0,num());savePlan();paint()}
  else if(act==='strategy'){plan.strategy=b.value;savePlan();paint()}
  else if(act==='budget'){const c=plan.cats.find(x=>x.name===b.dataset.cat);if(c){c.budget=Math.max(0,num());savePlan();paint()}}
  else if(act==='due'){if(setDue(b.dataset.key,b.value)){paint();dueToast(b.dataset.key)}}
  else if(act==='actual'){
    const k=b.dataset.key,v=b.value.trim(),ap=plan.applied||(plan.applied={}),parts=k.split(':');
    const a=parts[0]==='in'&&parts[1].startsWith('div-')?acct(parts[1].slice(4)):null;
    const undo=()=>{const p=ap[k];if(p&&a){a[p.f]=r2((+a[p.f]||0)-p.v)}delete ap[k]};
    if(v===''){undo();delete plan.actual[k];delete plan.done[k]}
    else{const n=parseFloat(v);if(isNaN(n))return;undo();plan.actual[k]=Math.abs(n);plan.done[k]=1;
      if(a){const f=a.divMode==='reinvest'?'bal':'cash',x=Math.abs(n);a[f]=r2((+a[f]||0)+x);ap[k]={f,v:x}}}
    savePlan();paint()}
  else if(act==='cash'){const a=A();if(a){a.cash=num();a.upd=TODAY;snapNW();savePlan();paint()}}
  else if(act==='apy'){const a=A();if(a){a.apy=Math.max(0,num());savePlan();paint()}}
  else if(act==='typ'){const a=A();if(a){a.typ=Math.max(0,num());savePlan();paint()}}
  else if(act==='payon'){setPay(b.dataset.key,b.value);paint();if(b.value)toast(`Payment moved to ${dl(b.value)}`)}
  else if(act==='stmt'){const a=A();if(a){a.stmt=Math.max(0,num());savePlan();paint()}}
  else if(act==='bal'){const a=A();if(a){a.bal=num();a.upd=TODAY;a.updAt=Date.now();snapNW();savePlan();paint()}}
  else if(act==='tcat'){const m=mk(view),t=tx[m].items.find(x=>x.id===id);if(t){const wasAi=t.ai;t.cat=b.value;delete t.ai;const n=follow(t,m);saveTx(m);learn(t);if(n||wasAi)paint();else $('#txs').textContent=txSum();if(n)toast(`Also set ${n} other charge${n>1?'s':''} from this merchant`)}}
});

/* ---------- start ---------- */
$('#rf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)restore(f)};
addEventListener('visibilitychange',()=>{if(document.hidden)flushAll()});
addEventListener('pagehide',flushAll);
(async()=>{
  try{
    if(window.claude&&claude.use){
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      const id=user&&await user.id();
      if(db&&id){S.db=db;S.uid=id}
    }
  }catch(e){}
  if(S.db)$('#savenote').textContent='Changes save automatically to your account and to this device.';
  moveOldKeys();
  try{plan=Object.assign(blank(),await sRead('plan')||{})}
  catch(e){S.locked=true;plan=blank();status('Load failed: reload before editing','bad')}
  if(!S.locked)status(okMsg());
  plan.payOn=plan.payOn||{};
  if(upgrade(plan))savePlan();
  const ui=lget('ui');if(ui&&VIEWS[ui.tab]&&ui.tab!=='kickoff')tab=ui.tab;
  if(plan.kickoff&&!plan.kickDone&&plan.accounts.length)tab='kickoff';
  render();
})();
})();
